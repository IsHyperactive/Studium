name: Compilar y publicar Studium Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studium-portable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} · Portable
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas ARM64 MSVC
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Pruebas del planificador
        run: npm run test
      - name: Compilar frontend
        run: npm run build
      - name: Compilar ejecutable de depuración (sin consola)
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verificar subsistema GUI en debug
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/debug/studium.exe"
          if (!(Test-Path $exe)) { throw "Debug executable missing: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'x64') { 0x8664 } else { 0xAA64 }
          if ($machine -ne $expectedMachine) { throw "Wrong PE architecture: $machine; expected $expectedMachine" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Debug build must use GUI subsystem (2), got $subsystem" }
          Write-Host "Verified debug Windows GUI subsystem: $subsystem"
      - name: Compilar ejecutable sin instalador
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }}
      - name: Verificar subsistema GUI del ejecutable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.target }}/release/studium.exe"
          if (!(Test-Path $exe)) { throw "Executable missing: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE signature" }
          $optionalHeader = $peOffset + 24
          $subsystemOffset = $optionalHeader + 68
          $subsystem = [BitConverter]::ToUInt16($bytes, $subsystemOffset)
          if ($subsystem -ne 2) { throw "Expected GUI subsystem (2), got subsystem $subsystem (console=3)" }
          Write-Host "Verified Windows GUI subsystem: $subsystem"
      - name: Preparar carpeta portable
        shell: pwsh
        run: |
          $out = "Studium-Windows-${{ matrix.arch }}-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "src-tauri/target/${{ matrix.target }}/release/studium.exe"
          if (!(Test-Path $exe)) { throw "No se encontró el ejecutable: $exe" }
          Copy-Item $exe "$out/Studium.exe"
          Copy-Item LICENSE "$out/LICENSE"
          @"
          Studium Portable
          Ejecuta Studium.exe directamente desde esta carpeta.
          Requiere WebView2 Runtime. Los datos se guardan junto a la app.
          "@ | Set-Content "$out/LEEME.txt"
      - name: Firma Authenticode (si se configura certificado)
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:CERT_B64 -or !$env:CERT_PASSWORD) { Write-Host 'No certificate secrets configured; leaving Windows exe unsigned.'; exit 0 }
          $certPath = Join-Path $env:RUNNER_TEMP 'studium-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))
          $exe = "Studium-Windows-${{ matrix.arch }}-Portable/Studium.exe"
          $signTool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw "SignTool not found" }
          & $signTool.FullName sign /fd SHA256 /f $certPath /p $env:CERT_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signTool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar ejecutable directo GUI
        shell: pwsh
        run: |
          $exe = "Studium-Windows-${{ matrix.arch }}-Portable/Studium.exe"
          if (!(Test-Path $exe)) { throw "Executable missing: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) { throw "Invalid PE signature" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw "Executable is console subsystem ($subsystem)" }
          Write-Host "Direct GUI executable verified: $subsystem"
      - name: Smoke test de arranque gráfico (Windows x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/${{ matrix.target }}/release/studium.exe"
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              $p.Refresh()
              if ($p.HasExited) { throw "Studium terminó al arrancar con código $($p.ExitCode)" }
              if ($p.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline
            if ($p.MainWindowHandle -eq 0) { throw "No se detectó una ventana principal de Studium tras 20 segundos" }
            Write-Host "GUI smoke test passed: PID=$($p.Id), HWND=$($p.MainWindowHandle)"
          } finally {
            if (!$p.HasExited) {
              if (!$p.CloseMainWindow()) { $p.Kill() }
              Start-Sleep -Seconds 2
              if (!$p.HasExited) { $p.Kill() }
            }
          }
      - name: Preparar asset con arquitectura en el nombre
        shell: pwsh
        run: |
          Copy-Item "Studium-Windows-${{ matrix.arch }}-Portable/Studium.exe" "Studium-Windows-${{ matrix.arch }}.exe"
      - name: Subir ejecutable directo
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Windows-${{ matrix.arch }}-Portable
          path: Studium-Windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} · AppImage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libfuse2
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Pruebas del planificador
        run: npm run test
      - name: Compilar frontend
        run: npm run build
      - name: Crear AppImage portable
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage
      - name: Renombrar AppImage
        run: |
          APP="$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APP"
          cp "$APP" "Studium-0.1.1-Linux-${{ matrix.arch }}.AppImage"
      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Linux-${{ matrix.arch }}-Portable
          path: Studium-0.1.1-Linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} · Portable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15-intel
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Pruebas del planificador
        run: npm run test
      - name: Compilar frontend
        run: npm run build
      - name: Crear app portable
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app
      - name: Comprimir .app
        run: |
          APP="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Studium-macOS-${{ matrix.arch }}-Portable.zip"
      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Studium-macOS-${{ matrix.arch }}-Portable
          path: Studium-macOS-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Unificar publicación portable
    if: github.event_name != 'pull_request'
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar solo los paquetes portables
        uses: actions/download-artifact@v4
        with:
          pattern: Studium-*-Portable
          path: release-assets
          merge-multiple: true
      - name: Inventario y hashes
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          {
            echo "# <img src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/recursos/icono.svg\" width=\"72\" align=\"left\" alt=\"Icono Studium\" /> Studium Portable"
            echo
            echo "Una aplicación local-first para estudiar, organizar materiales y mantener tus sesiones de aprendizaje. Portable, sin cuentas y sin sincronización obligatoria."
            echo
            echo "## Qué puedes hacer"
            echo "- **Biblioteca:** añade, edita, elimina, busca y filtra materiales por materia. Organiza apuntes, libros, enlaces y recursos."
            echo "- **Notas:** escribe y guarda notas de estudio."
            echo "- **Tarjetas de repaso:** crea tarjetas de pregunta/respuesta y repásalas con intervalos básicos."
            echo "- **Sesiones de enfoque:** temporizador de 15, 25, 45 o 60 minutos; pausa, reinicio y registro de sesiones."
            echo "- **Progreso:** consulta minutos de estudio, objetivos diarios, materiales, tarjetas pendientes y materias."
            echo "- **Respaldo:** exporta e importa tus datos en JSON."
            echo
            echo "## Firma de Windows"
            echo "La firma Authenticode es opcional en CI y requiere un certificado de firma de código configurado como GitHub Secrets. Sin certificado, los EXE directos de Windows quedan sin firmar; SmartScreen puede advertir."
            echo
            echo "## Qué hace Studium"
            echo "- Importa PDF, EPUB, DOCX, TXT y Markdown y extrae texto en el dispositivo."
            echo "- Genera resumen, esquema, conceptos clave, preguntas y un plan local heurístico (no IA) con evidencia, objetivos medibles, práctica activa y repaso."
            echo "- Crea tarjetas de repaso automáticamente y guarda una guía en la Biblioteca."
            echo "- El plan local usa estructura, términos y fragmentos del archivo para sesiones progresivas, recuperación activa, práctica, checkpoints y repaso espaciado. No es IA ni entrenamiento de modelos. Los PDF escaneados requieren OCR, que aún no está incluido."
            echo
            echo "## Descargas"
            echo "| Plataforma | Arquitectura | Formato |"
            echo "|---|---|---|"
            echo "| Windows | x64 | EXE directo |"
            echo "| Windows | ARM64 | EXE directo |"
            echo "| Linux | x64 | AppImage |"
            echo "| Linux | ARM64 | AppImage |"
            echo "| macOS | Intel x64 | ZIP con .app |"
            echo "| macOS | Apple Silicon ARM64 | ZIP con .app |"
            echo
            echo "## Uso"
            echo "- Windows: descarga Studium.exe y ejecútalo directamente. Requiere WebView2."
            echo "- Linux: concede permiso de ejecución al AppImage y ábrelo. Puede necesitar FUSE 2."
            echo "- macOS: extrae el ZIP y mueve/abre Studium.app. No está firmado ni notarizado."
            echo "- Los datos se conservan en el directorio portable de Studium. Mantén el directorio completo."
            echo
            echo "## Integridad"
            echo "Verifica los archivos con SHA256SUMS.txt."
            echo
            echo "## Build"
            echo "- Commit: [${SHA}](${REPO_URL}/commit/${SHA})"
            echo "- Workflow: [Ver compilación](${RUN_URL})"
            echo
            echo "## Limitaciones conocidas"
            echo "Limitaciones: no incluye OCR para PDF escaneados, IA integrada, exámenes, audio, anotación con lápiz, sincronización ni cuentas. El plan de estudio es heurístico local y puede omitir detalles; revisa las evidencias y preguntas antes de usarlo."
            echo
            echo "## Sobre la versión"
            echo "Lanzamiento oficial estable de Studium 0.1.1. Windows ofrece ejecutables EXE directos; Linux AppImage y macOS apps portables en ZIP. No incluye instaladores, DEB, DMG, APK ni versiones duplicadas."
          } > RELEASE_NOTES.md
      - name: Alinear tag oficial con el commit verificado
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.1" -f sha="${SHA}" -F force=true
          echo "Tag v0.1.1 apunta al commit que acaba de compilarse."
      - name: Publicar una única release portable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: Studium v0.1.1 · Lanzamiento oficial
          target_commitish: main
          prerelease: false
          make_latest: true
          body_path: release-assets/RELEASE_NOTES.md
          files: release-assets/*
      - name: Verificar release estable y assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.1")"
          test "$(jq -r .prerelease <<< "$release")" = "false"
          test "$(jq -r .tag_name <<< "$release")" = "v0.1.1"
          assets="$(jq -r '.assets[].name' <<< "$release")"
          for expected in "Studium-Windows-x64.exe" "Studium-Windows-arm64.exe" "Studium-0.1.1-Linux-x64.AppImage" "Studium-0.1.1-Linux-arm64.AppImage" "Studium-macOS-x64-Portable.zip" "Studium-macOS-arm64-Portable.zip" "RELEASE_NOTES.md" "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<< "$assets" || { echo "Falta asset: $expected"; exit 1; }
          done
          echo "Release estable v0.1.1 verificada con los ocho assets esperados."
      - name: Descargar y verificar contenido, SHA256 y formatos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check="${RUNNER_TEMP}/release-check"
          mkdir -p "${check}"
          gh release download v0.1.1 --repo "${GITHUB_REPOSITORY}" --dir "${check}"
          cd "${check}"
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
          for name in "Studium-Windows-x64.exe" "Studium-Windows-arm64.exe"; do
            test -s "${name}"
            file "${name}" | grep -q PE32
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(); p=struct.unpack_from("<I",d,0x3c)[0]; assert d[p:p+4]==bytes.fromhex("50450000"); machine=struct.unpack_from("<H",d,p+4)[0]; expected={"Studium-Windows-x64.exe":0x8664,"Studium-Windows-arm64.exe":0xAA64}[sys.argv[1]]; assert machine==expected, "wrong PE architecture"; assert struct.unpack_from("<H",d,p+24+68)[0]==2, "GUI subsystem not set"' "${name}"
          done
          for name in "Studium-0.1.1-Linux-x64.AppImage" "Studium-0.1.1-Linux-arm64.AppImage"; do
            test -s "${name}"
            file "${name}" | grep -q ELF
          done
          for name in "Studium-macOS-x64-Portable.zip" "Studium-macOS-arm64-Portable.zip"; do
            test -s "${name}"
            unzip -l "${name}" | grep -q "Studium.app/Contents/Info.plist"
          done
          for arch in x64 arm64; do
            zip="Studium-macOS-${arch}-Portable.zip"
            binary="${check}/studium-${arch}"
            unzip -p "${zip}" "Studium.app/Contents/MacOS/studium" > "${binary}"
            file "${binary}" | grep -q "Mach-O"
            if [ "${arch}" = "x64" ]; then file "${binary}" | grep -q "x86_64"; else file "${binary}" | grep -q "arm64"; fi
          done
          if grep -Eiq 'compilación[[:space:]]+[0-9]+|build[[:space:]]+[0-9]+' RELEASE_NOTES.md; then
            echo "Las notas contienen un número de compilación interno."
            exit 1
          fi
          echo "Se verificaron los seis paquetes, sus hashes, los formatos y las notas públicas."
      - name: Eliminar assets sobrantes de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.1" --jq .id)"
          expected=( "RELEASE_NOTES.md" "SHA256SUMS.txt" "Studium-Windows-x64.exe" "Studium-Windows-arm64.exe" "Studium-0.1.1-Linux-x64.AppImage" "Studium-0.1.1-Linux-arm64.AppImage" "Studium-macOS-x64-Portable.zip" "Studium-macOS-arm64-Portable.zip" )
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "${asset_id}" ] && continue
            if ! printf '%s\n' "${expected[@]}" | grep -Fxq "${asset_name}"; then
              gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              echo "Eliminado asset obsoleto: ${asset_name}"
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[] | [.id,.name] | @tsv')
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.1" --jq '.assets[].name' | sort)"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort)"
          diff -u <(printf '%s\n' "${expected_sorted}") <(printf '%s\n' "${actual}")
          echo "Release contiene únicamente los 8 assets oficiales."
      - name: Eliminar releases y tags antiguos (solo tras verificación)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep_tag="v0.1.1"
          old_releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name != \"${keep_tag}\") | .id")"
          while IFS= read -r release_id; do
            [ -z "$release_id" ] && continue
            gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done <<< "$old_releases"
          old_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq ".[] | select(.name != \"${keep_tag}\") | .name")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          done <<< "$old_tags"

name: Compilar y publicar Studium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studium-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas ARM64 MSVC
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend
        run: npm run build
      - name: Compilar instalador
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis
      - name: Preparar portable ZIP
        shell: pwsh
        run: |
          $out = "dist-portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "src-tauri/target/${{ matrix.target }}/release/studium.exe"
          if (!(Test-Path $exe)) { throw "No se encontró el ejecutable: $exe" }
          Copy-Item $exe "$out/Studium.exe"
          Copy-Item LICENSE "$out/LICENSE"
          @"
          Studium Portable
          Ejecutable: Studium.exe
          Requiere Windows y WebView2 Runtime. Los datos se guardan en el perfil del usuario.
          "@ | Set-Content "$out/LEEME.txt"
          Compress-Archive -Path "$out/*" -DestinationPath "Studium-Windows-${{ matrix.arch }}-Portable.zip" -Force
      - name: Subir instalador y portable
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            Studium-Windows-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libfuse2
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend
        run: npm run build
      - name: Compilar formatos Linux
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage,deb
      - name: Crear portable tar.gz
        run: |
          mkdir -p dist-portable
          cp src-tauri/target/${{ matrix.target }}/release/studium dist-portable/Studium
          cp LICENSE dist-portable/
          printf 'Studium portable\nEjecutar ./Studium. Requiere bibliotecas GTK/WebKitGTK compatibles con la distribución.\n' > dist-portable/LEEME.txt
          tar -czf Studium-Linux-${{ matrix.arch }}-Portable.tar.gz -C dist-portable .
      - name: Subir paquetes Linux
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Linux-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            Studium-Linux-${{ matrix.arch }}-Portable.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend
        run: npm run build
      - name: Compilar DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg
      - name: Crear ZIP portable de aplicación
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Studium.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Studium-macOS-${{ matrix.arch }}-Portable.zip"
      - name: Subir macOS
        uses: actions/upload-artifact@v4
        with:
          name: Studium-macOS-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            Studium-macOS-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - arch: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK y NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Dependencias
        run: npm install
      - name: Frontend
        run: npm run build
      - name: Inicializar Android
        run: npm run tauri android init -- --ci
      - name: Iconos Android
        run: npm run icons
      - name: APK
        run: npm run tauri android build -- --apk --target ${{ matrix.tauri_target }} --ci
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Android-${{ matrix.arch }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicación con notas y checksums
    needs: [windows, linux, macos, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos de todas las plataformas
        uses: actions/download-artifact@v4
        with:
          pattern: Studium-*
          path: release-artifacts
      - name: Preparar assets con nombres de plataforma
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            group="$(basename "$(dirname "$file")")"
            filename="$(basename "$file")"
            cp "$file" "release-assets/${group}-${filename}"
          done
      - name: Generar notas, inventario y hashes
        env:
          VERSION: 0.1.0
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          {
            echo "# Studium ${VERSION} — compilación #${RUN_NUMBER}"
            echo
            echo "> **Estado:** compilación automática de desarrollo. No es una versión estable ni está firmada."
            echo
            echo "## Qué incluye"
            echo "- Windows: x86 (32 bits), x64 y ARM64 — instalador NSIS y ZIP portable."
            echo "- Linux: x64 y ARM64 — AppImage, DEB y archivo portable TAR.GZ."
            echo "- macOS: Intel x64 y Apple Silicon ARM64 — DMG y ZIP de la aplicación."
            echo "- Android: ARM64 y x86_64 — APK."
            echo
            echo "## Compatibilidad y notas"
            echo "- Windows: necesita WebView2 Runtime; el ZIP portable no instala dependencias."
            echo "- Linux: AppImage es la opción portable preferida; DEB para Debian/Ubuntu. El TAR.GZ requiere bibliotecas del sistema compatibles."
            echo "- macOS: los paquetes no están firmados ni notarizados; macOS puede mostrar advertencias de Gatekeeper."
            echo "- Android: APK de instalación directa; puede requerir permitir instalación desde fuentes externas."
            echo "- Los formatos portables conservan sus archivos dentro del paquete; esta compilación no garantiza que los datos del usuario se almacenen junto a la aplicación."
            echo
            echo "## Instalación"
            echo "Consulta el nombre de cada archivo para elegir plataforma y arquitectura. Para paquetes portables, extrae el archivo y abre la aplicación. Los instaladores convencionales siguen las instrucciones de su sistema."
            echo
            echo "## Verificación de integridad"
            echo "Descarga `SHA256SUMS.txt` junto a tu archivo y verifica el hash SHA-256."
            echo
            echo "## Información de la compilación"
            echo "- Commit: ${SHA}"
            echo "- Workflow: [run #${RUN_NUMBER}](${RUN_URL})"
            echo "- Rama: main"
            echo
            echo "## Limitaciones"
            echo "Studium está en etapa de esqueleto inicial. La interfaz es demostrativa; las funciones del MVP todavía no están implementadas."
          } > RELEASE_NOTES.md
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Studium v0.1.0 · Compilación #${{ github.run_number }}
          target_commitish: main
          prerelease: true
          make_latest: false
          body_path: release-assets/RELEASE_NOTES.md
          files: release-assets/*

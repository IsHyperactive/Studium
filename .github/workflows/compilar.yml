name: Compilar Studium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar herramientas ARM64 MSVC
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalar dependencias frontend
        run: npm install

      - name: Generar iconos para la plataforma
        run: npm run icons

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Compilar frontend
        run: npm run build

      - name: Compilar aplicación Windows
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Studium-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Guardar lockfiles generados
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles-windows-${{ matrix.arch }}
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android SDK y NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar dependencias frontend
        run: npm install

      - name: Compilar frontend
        run: npm run build

      - name: Inicializar proyecto Android
        run: npm run tauri android init -- --ci

      - name: Generar iconos Android
        run: npm run icons

      - name: Compilar APK ARM64
        run: npm run tauri android build -- --apk --target aarch64 --ci

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Studium-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar lockfiles generados
        uses: actions/upload-artifact@v4
        with:
          name: lockfiles-android-arm64
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14

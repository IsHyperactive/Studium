name: Compilar y publicar Studium Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studium-portable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} · Portable
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas ARM64 MSVC
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & $installer modify --installPath "$vs" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar frontend
        run: npm run build
      - name: Compilar ejecutable
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis
      - name: Empaquetar portable
        shell: pwsh
        run: |
          $out = "Studium-Windows-${{ matrix.arch }}-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = "src-tauri/target/${{ matrix.target }}/release/studium.exe"
          if (!(Test-Path $exe)) { throw "No se encontró el ejecutable: $exe" }
          Copy-Item $exe "$out/Studium.exe"
          Copy-Item LICENSE "$out/LICENSE"
          @"
          Studium Portable
          Ejecuta Studium.exe directamente desde esta carpeta.
          Requiere WebView2 Runtime. Los datos de Studium se guardan junto a la aplicación.
          "@ | Set-Content "$out/LEEME.txt"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Windows-${{ matrix.arch }}-Portable
          path: Studium-Windows-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} · AppImage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libfuse2
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar frontend
        run: npm run build
      - name: Crear AppImage portable
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles appimage
      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Studium-Linux-${{ matrix.arch }}-Portable
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} · Portable
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm install
      - name: Iconos
        run: npm run icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar frontend
        run: npm run build
      - name: Crear app portable
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app
      - name: Comprimir .app
        run: |
          APP="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Studium-macOS-${{ matrix.arch }}-Portable.zip"
      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Studium-macOS-${{ matrix.arch }}-Portable
          path: Studium-macOS-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Unificar publicación portable
    needs: [windows, linux, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar solo los paquetes portables
        uses: actions/download-artifact@v4
        with:
          pattern: Studium-*-Portable
          path: release-assets
          merge-multiple: true
      - name: Inventario y hashes
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          {
            echo "# Studium Portable · compilación ${RUN_NUMBER}"
            echo
            echo "Una sola publicación con paquetes portables de escritorio. No se publican instaladores, DEB, DMG, APK ni paquetes redundantes."
            echo
            echo "## Descargas"
            echo "| Plataforma | Arquitectura | Formato |"
            echo "|---|---|---|"
            echo "| Windows | x64 | ZIP portable |"
            echo "| Windows | ARM64 | ZIP portable |"
            echo "| Linux | x64 | AppImage |"
            echo "| Linux | ARM64 | AppImage |"
            echo "| macOS | Intel x64 | ZIP con .app |"
            echo "| macOS | Apple Silicon ARM64 | ZIP con .app |"
            echo
            echo "## Uso"
            echo "- Windows: extrae el ZIP y abre Studium.exe. Requiere WebView2."
            echo "- Linux: concede permiso de ejecución al AppImage y ábrelo. Puede necesitar FUSE 2."
            echo "- macOS: extrae el ZIP y mueve/abre Studium.app. No está firmado ni notarizado."
            echo "- Los datos se conservan en el directorio portable de Studium. Mantén el directorio completo."
            echo
            echo "## Integridad"
            echo "Verifica los archivos con SHA256SUMS.txt."
            echo
            echo "## Build"
            echo "- Commit: [${SHA}](${REPO_URL}/commit/${SHA})"
            echo "- Workflow: [run ${RUN_NUMBER}](${RUN_URL})"
            echo
            echo "## Limitaciones conocidas"
            echo "Studium sigue en desarrollo. No incluye instaladores ni Android en esta distribución portable."
          } > RELEASE_NOTES.md
      - name: Eliminar releases y tags anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep_tag="v0.1.0-portable"
          old_releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name != \"${keep_tag}\") | .id")"
          while IFS= read -r release_id; do
            [ -z "$release_id" ] && continue
            gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done <<< "$old_releases"
          old_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq ".[] | select(.name != \"${keep_tag}\") | .name")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
          done <<< "$old_tags"
      - name: Publicar una única release portable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-portable
          name: Studium v0.1.0 · Portable
          target_commitish: main
          prerelease: true
          make_latest: true
          body_path: release-assets/RELEASE_NOTES.md
          files: release-assets/*
